schemaVersion: 2.2.0
metadata:
  name: dls-devspaces

components:
  - name: kai-dev-container
    container:
      image: quay.io/dbrugger946/dls-devspaces:ubi9-latest
      memoryLimit: 4Gi
      mountSources: true

commands:
  - id: configure-git
    exec:
      component: kai-dev-container
      commandLine: |
        git config --global user.email "${GIT_EMAIL}"
        git config --global user.name "${GIT_USERNAME}"
        if [ -d "kai-coolstore" ]; then
          rm -rf kai-coolstore
        fi
        git clone http://$GIT_USERNAME:$GIT_PASSWORD@gitea.gitea.svc.cluster.local:3000/$GIT_ORG/kai-coolstore        
      workingDir: /projects
  - id: configure-vscode
    exec:
      component: kai-dev-container
      commandLine: |
        mkdir -p $HOME/.vscode-oss/User
        cp /projects/kai-coolstore/.vscode/settings.json $HOME/.vscode-oss/User/settings.json
        pkill -9 -f 'jdtls' 2>/dev/null || true
        rm -rf $HOME/.cache/jdtls 2>/dev/null || true
        echo "Java Standard mode configured in both user and workspace settings"

events:
  postStart:
    - configure-vscode
    - configure-git

projects:
  - name: kai-coolstore
    git:
      remotes:
        origin: https://github.com/rhpds/kai-coolstore.git
      checkoutFrom:
        revision: main
