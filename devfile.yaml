schemaVersion: 2.2.0
metadata:
  name: dls-devspaces

components:
  - name: kai-dev-container
    container:
      image: quay.io/dbrugger946/dls-devspaces:ubi9-latest
      memoryLimit: 4Gi
      mountSources: true

commands:
  - id: setup-workspace
    exec:
      component: kai-dev-container
      commandLine: |
        mkdir -p /home/user/.vscode-oss/User
        cp /projects/kai-coolstore/.vscode/settings.json /home/user/.vscode-oss/User/settings.json

        echo '{"folders":[{"name":"kai-coolstore","path":"/projects/kai-coolstore"}],"settings":{"java.server.launchMode":"Standard"}}' > /projects/.code-workspace

        (
          cd /projects && \
          rm -rf kai-coolstore && \
          git clone http://$GIT_USERNAME:$GIT_PASSWORD@gitea.gitea.svc.cluster.local:3000/$GIT_ORG/kai-coolstore && \
          cp /projects/kai-coolstore/.vscode/settings.json /home/user/.vscode-oss/User/settings.json
        ) > /tmp/gitea-clone.log 2>&1 &

events:
  postStart:
    - setup-workspace

projects:
  - name: kai-coolstore
    git:
      remotes:
        origin: https://github.com/rhpds/kai-coolstore.git
